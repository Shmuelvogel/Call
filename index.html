<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>B'Above Field</title>
<style>[hidden]{display:none!important}body{margin:0;font-family:system-ui,Roboto,sans-serif}#call{background:#f3f4f2;min-height:100vh;text-align:center;padding:60px 20px;box-sizing:border-box}#cam{background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px;text-align:center}.sr{font:700 15px monospace;color:#9fe3c0}.t{font-size:18px;font-weight:700}.s{font-size:13px;color:#aaa}.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}.shot{width:190px;height:190px;border-radius:50%;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 20px system-ui;border:8px solid #2e8b5f}.shot b{font-size:54px}.row{display:flex;gap:12px}.b2{background:#222;border:1px solid #444;color:#fff;border-radius:14px;padding:14px 18px;font:700 16px system-ui}input{display:none}.g{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.g div{position:relative}.g img,.g video{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#333}.ok{position:absolute;right:4px;bottom:4px;background:#2e8b5f;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}.sp{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px}#bar{padding:16px;text-align:center;font:800 18px system-ui}.done{display:block;margin:0 16px 20px;background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center;font:800 18px system-ui;border:0;width:calc(100% - 32px)}</style></head><body>
<div id="call" hidden><div id="n" style="font-size:34px;font-weight:800;margin-bottom:24px"></div><a id="b" style="display:block;background:#1f6b4a;color:#fff;text-decoration:none;font-size:26px;font-weight:800;border-radius:16px;padding:24px">📞 Call · Llamar</a><p style="color:#666">Tap the green button to call.<br>Toca el botón verde para llamar.</p></div>
<div id="cam" hidden><div class="top"><div class="sr" id="sr"></div><div class="t" id="ti"></div><div class="s" id="si"></div></div>
<div class="mid"><div class="g" id="g"></div><label class="shot" id="sh"><b>📷</b><span id="sl">Foto</span><input type="file" accept="image/*" capture="environment" onchange="add(this)"></label>
<div class="row"><label class="b2">🎥 Video<input type="file" accept="video/*" capture="environment" onchange="add(this)"></label><label class="b2">🖼️ Galería<input type="file" accept="image/*,video/*" multiple onchange="add(this)"></label></div></div>
<div id="bar"></div><button class="done" id="dn" hidden onclick="history.length>1?history.back():window.close()">✓ Listo — volver</button></div>
<script>
var h=decodeURIComponent(location.hash.slice(1)),n=0,ok=0;
if(h.indexOf('cam|')==0){var p=h.split('|');document.getElementById('cam').hidden=false;document.getElementById('sr').textContent=p[1]||'';document.getElementById('ti').textContent=p[2]||'';document.getElementById('si').textContent=(p[3]||'')+' · '+(p[4]||'')}
else{document.getElementById('call').hidden=false;var d=h.replace(/\D/g,'');if(d.length==10)d='1'+d;var x=d.slice(-10);document.getElementById('n').textContent='('+x.slice(0,3)+') '+x.slice(3,6)+'-'+x.slice(6);document.getElementById('b').href='tel:+'+d}
function add(i){[].slice.call(i.files,0,6).forEach(function(f){n++;var w=document.createElement('div'),v=/^video/.test(f.type),u=URL.createObjectURL(f);w.innerHTML=(v?'<video muted src="'+u+'"></video>':'<img src="'+u+'">')+'<div class="sp">Guardando…</div>';document.getElementById('g').appendChild(w);bar();save(f,function(){w.querySelector('.sp').outerHTML='<div class="ok">✓</div>';ok++;bar()})});i.value='';document.getElementById('sl').textContent='Otra'}
function bar(){var b=document.getElementById('bar');if(ok<n){b.style.background='#8a5a12';b.textContent='⏳ Guardando '+(ok+1)+' de '+n+'…'}else{b.style.background='#2e8b5f';b.textContent='✓ '+n+(n==1?' archivo guardado':' archivos guardados')+' · TEST';document.getElementById('dn').hidden=false}}
function save(f,cb){setTimeout(cb,900)}
</script></body></html>
