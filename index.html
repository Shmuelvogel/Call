<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>B'Above Field</title>
<style>[hidden]{display:none!important}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#f3f4f2;color:#1d2420}#call{min-height:100vh;text-align:center;padding:60px 20px;box-sizing:border-box}
.hd{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd}.hd b{font-size:17px}.hd small{color:#5d6760;font-size:13px;margin-left:8px}
.job{margin:14px;background:#fff;border-radius:12px;border-left:5px solid #1f6b4a;padding:12px 14px}.sr{font:13px monospace;color:#5d6760}.t{font-weight:800;font-size:17px;margin-top:2px}.s{font-size:13px;color:#5d6760;margin-top:2px}
.w{padding:0 14px 140px;display:grid;gap:14px}.h2{font-weight:800;font-size:20px;text-align:center}.h2 i{display:block;font-weight:500;font-size:14px;color:#5d6760;font-style:normal}
.row{display:flex;gap:12px;justify-content:center}.ph{display:grid;gap:4px;justify-items:center;font-size:14px;font-weight:700}.ph i{font-weight:500;color:#5d6760;font-style:normal;font-size:12px}
.box{width:150px;height:150px;border-radius:12px;position:relative;border:3px dashed #c9cfc8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-sizing:border-box}.box.now{border-color:#c9a24a;background:#fdf8ec}.box.have{border:3px solid #1f6b4a}
.box img{width:100%;height:100%;object-fit:cover;border-radius:9px}.x{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:0;background:#1d2420;color:#fff;font:800 17px/1 system-ui}
.ok{position:absolute;right:6px;bottom:6px;background:#1f6b4a;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800}.sp{position:absolute;inset:0;background:rgba(255,255,255,.7);border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 13px system-ui}
.big{display:block;border-radius:14px;padding:22px 16px;text-align:center;font:800 21px system-ui;border:0;width:100%;box-sizing:border-box;cursor:pointer}.big small{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:3px}
.dark{background:#1d2420;color:#fff}.grn{background:#1f6b4a;color:#fff}.wht{background:#fff;color:#1d2420;border:2px solid #1d2420}
label.big input{display:none}.lnk{text-align:center;font-size:15px;color:#1f6b4a;font-weight:700;text-decoration:underline;padding:6px}.lnk input{display:none}
textarea,.sgn{font:16px system-ui;border:1px solid #c9cfc8;border-radius:10px;padding:12px;width:100%;box-sizing:border-box;background:#fff}textarea{min-height:64px}
details summary{font-weight:700;font-size:15px;padding:6px 0}.pad{background:#fff;border:1px solid #c9cfc8;border-radius:10px;margin-top:8px}.pad canvas{display:block;width:100%;height:auto;touch-action:none}
.foot{position:fixed;left:0;right:0;bottom:0;background:#f3f4f2;padding:12px 14px 16px;box-shadow:0 -4px 12px rgba(0,0,0,.08)}.msg{text-align:center;font-weight:800;font-size:17px;padding:12px;border-radius:12px}.msg.g{background:#dcefe5;color:#1f6b4a}.msg.y{background:#f8ecd6;color:#8a5a12}
.ex{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.ex div{position:relative}.ex img,.ex video{width:76px;height:76px;object-fit:cover;border-radius:8px}
#zz{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}#zz img,#zz video{max-width:100%;max-height:100%}</style></head><body>
<div id="call" hidden><div id="n" style="font-size:34px;font-weight:800;margin-bottom:24px"></div><a id="b" style="display:block;background:#1f6b4a;color:#fff;text-decoration:none;font-size:26px;font-weight:800;border-radius:16px;padding:24px">📞 Call · Llamar</a><p style="color:#666">Tap the green button to call.<br>Toca el botón verde para llamar.</p></div>
<div id="cam" hidden><div class="hd"><b>B'Above Field</b><small id="who"></small></div>
<div class="job"><div class="sr" id="sr"></div><div class="t" id="ti"></div><div class="s" id="si"></div></div>
<div class="w"><div class="h2" id="h"></div>
<div class="row"><div class="ph"><div class="box" id="b1">📷</div>Close-up<i>De cerca</i></div><div class="ph"><div class="box" id="b2">📷</div>From far<i>De lejos</i></div></div>
<div class="ex" id="ex"></div>
<div id="fin" hidden><textarea id="note" placeholder="What did you do? (optional) · ¿Qué hiciste? (opcional)"></textarea>
<details><summary>✍️ Director sign-off (optional) · Firma del director</summary><input class="sgn" id="sgn" placeholder="Director name · Nombre"><div class="pad"><canvas id="cv" width="700" height="220"></canvas></div><div class="lnk" onclick="clr()">Clear · Borrar</div></details>
<label class="lnk">＋ Add extra photo / video · Agregar foto o video<input type="file" accept="image/*,video/*" multiple onchange="add(this,'extra')"></label></div></div>
<div class="foot" id="foot"></div></div>
<script>
var h=decodeURIComponent(location.hash.slice(1)),P={close:null,far:null},X=[],sent=false;
function $(i){return document.getElementById(i)}
if(h.indexOf('cam|')==0){var p=h.split('|');$('cam').hidden=false;$('sr').textContent=p[1]||'';$('ti').textContent=p[2]||'';$('si').textContent='📍 '+(p[3]||'');$('who').textContent=p[4]||''}
else{$('call').hidden=false;var d=h.replace(/\D/g,'');if(d.length==10)d='1'+d;var x=d.slice(-10);$('n').textContent='('+x.slice(0,3)+') '+x.slice(3,6)+'-'+x.slice(6);$('b').href='tel:+'+d}
function camBtn(t,lbl,sub,cls){return '<label class="big '+cls+'">📷 '+lbl+'<small>'+sub+'</small><input type="file" accept="image/*" capture="environment" onchange="add(this,\''+t+'\')"></label>'}
function add(i,t){[].slice.call(i.files,0,6).forEach(function(f){var it={f:f,v:/^video/.test(f.type),u:URL.createObjectURL(f),st:'new'};if(t=='extra')X.push(it);else P[t]=it});i.value='';ui()}
function zoom(it){var z=$('zz');z.innerHTML=it.v?'<video controls autoplay src="'+it.u+'"></video>':'<img src="'+it.u+'">';z.hidden=false}
function box(n,t){var b=$('b'+n),it=P[t];b.className='box'+(it?' have':(nxt()==t?' now':''));b.innerHTML='';
 if(!it){b.textContent='📷';return}var im=document.createElement('img');im.src=it.u;im.onclick=function(){zoom(it)};b.appendChild(im);
 if(it.st=='new'){var x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=function(){P[t]=null;ui()};b.appendChild(x)}
 else if(it.st=='up')b.insertAdjacentHTML('beforeend','<div class="sp">Sending…</div>');else b.insertAdjacentHTML('beforeend','<div class="ok">✓</div>')}
function nxt(){return !P.close?'close':!P.far?'far':''}
function ui(){box(1,'close');box(2,'far');var n=nxt(),f=$('foot');
 $('ex').innerHTML='';X.forEach(function(it,i){var d=document.createElement('div');d.innerHTML=(it.v?'<video muted src="'+it.u+'"></video>':'<img src="'+it.u+'">')+(it.st=='new'?'<button class="x">×</button>':'');d.firstChild.onclick=function(){zoom(it)};if(it.st=='new')d.querySelector('.x').onclick=function(){X.splice(i,1);ui()};$('ex').appendChild(d)});
 $('fin').hidden=!!n||sent||(P.close&&P.close.st!='new');
 if(P.close&&P.close.st=='up'&&!sent){$('h').innerHTML='Sending…<i>Enviando…</i>'}
 if(sent){$('h').innerHTML='✓ Job marked done<i>Trabajo marcado como terminado</i>';f.innerHTML='<div class="msg g">✓ Job done · '+(2+X.length)+' photos · TEST</div><button class="big wht" style="margin-top:10px" onclick="goBack()">← Back to my jobs<small>Volver a mis trabajos</small></button>'}
 else if(n=='close'){$('h').innerHTML='Step 1: close-up photo<i>Paso 1: foto de cerca</i>';f.innerHTML=camBtn('close','Take close-up','Tomar foto de cerca','dark')}
 else if(n=='far'){$('h').innerHTML='Close-up ✓<i>Ahora una foto de lejos (toda el área)</i>';f.innerHTML=camBtn('far','Now take one from far','Ahora una de lejos','dark')}
 else{$('h').innerHTML='Check your 2 photos<i>Tap × to retake · Toca × para repetir</i>';f.innerHTML='<button class="big grn" onclick="send()">✓ Send – job done<small>Enviar – trabajo terminado</small></button>'}}
function send(){var q=[P.close,P.far].concat(X),k=0;q.forEach(function(it){it.st='up'});$('fin').hidden=true;
 (function nx(){ui();$('foot').innerHTML='<div class="msg y">⏳ Sending '+(Math.min(k+1,q.length))+' of '+q.length+'… · Enviando</div>';if(k>=q.length){sent=true;ui();return}save(q[k],function(){q[k].st='ok';k++;nx()})})()}
function goBack(){if(history.length>1)history.back();else{window.close();setTimeout(function(){$('foot').insertAdjacentHTML('afterbegin','<div class="msg y" style="margin-bottom:8px">Tap the X at the top · Toca la X arriba</div>')},400)}}
var cv,cx,dr=0;function cvInit(){cv=$('cv');cx=cv.getContext('2d');cx.lineWidth=4;cx.lineCap='round';function P2(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
cv.addEventListener('pointerdown',function(e){e.preventDefault();dr=1;var p=P2(e);cx.beginPath();cx.moveTo(p[0],p[1])});cv.addEventListener('pointermove',function(e){if(!dr)return;var p=P2(e);cx.lineTo(p[0],p[1]);cx.stroke()});window.addEventListener('pointerup',function(){dr=0})}
function clr(){cx.clearRect(0,0,cv.width,cv.height)}
function save(it,cb){setTimeout(cb,800)}
cvInit();ui();
</script><div id="zz" hidden onclick="this.hidden=true;this.innerHTML=''"></div></body></html>
