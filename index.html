<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>B'Above Field</title>
<style>[hidden]{display:none!important}body{margin:0;font-family:system-ui,Roboto,sans-serif}#call{background:#f3f4f2;min-height:100vh;text-align:center;padding:60px 20px;box-sizing:border-box}#cam{background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px;text-align:center}.sr{font:700 15px monospace;color:#9fe3c0}.t{font-size:18px;font-weight:700}.s{font-size:13px;color:#aaa}.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:10px 16px}.shot{width:150px;height:150px;text-align:center;border-radius:50%;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 20px system-ui;border:8px solid #2e8b5f}.shot b{font-size:50px}.shot span{font-size:19px}small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:2px}.hl{font-size:14px;color:#ddd;margin-top:10px;line-height:1.4}.hl i{color:#aaa}.b2{text-align:center}.row{display:flex;gap:12px}.b2{background:#222;border:1px solid #444;color:#fff;border-radius:14px;padding:14px 18px;font:700 16px system-ui}input{display:none}.g{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.g div{position:relative}.g img,.g video{width:104px;height:104px;object-fit:cover;border-radius:10px;background:#333}.ok{position:absolute;right:4px;bottom:4px;background:#2e8b5f;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800}.sp{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px}.steps{display:flex;gap:14px}.stp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}.stp i{font-size:12px;color:#aaa}.bx{width:110px;height:110px;border-radius:12px;border:3px dashed #555;display:flex;align-items:center;justify-content:center;position:relative}.bx span{font:800 34px system-ui;color:#555}.stp.now .bx{border-color:#ffd27a}.stp.now .bx span{color:#ffd27a}.stp.have .bx{border:3px solid #2e8b5f}.bx>div{position:absolute;inset:0}.bx img,.bx video{width:100%!important;height:100%!important;border-radius:9px;object-fit:cover}.gl{font-size:14px;font-weight:700;color:#ffd27a;text-align:center;line-height:1.4}.up{display:block;margin:0 16px 12px;background:#2e8b5f;color:#fff;border:0;border-radius:14px;padding:18px;font:800 20px system-ui;width:calc(100% - 32px)}.gl i{font-weight:500;color:#aaa}.x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#fff;color:#111;font:800 18px/1 system-ui}.pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;pointer-events:none}#zz{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}#zz img,#zz video{max-width:100%;max-height:100%}.foot{position:sticky;bottom:0;background:#111;padding-top:4px;box-shadow:0 -6px 12px rgba(0,0,0,.6)}#bar{padding:16px;text-align:center;font:800 18px system-ui}.done{display:block;margin:0 16px 20px;background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center;font:800 18px system-ui;border:0;width:calc(100% - 32px)}</style></head><body>
<div id="call" hidden><div id="n" style="font-size:34px;font-weight:800;margin-bottom:24px"></div><a id="b" style="display:block;background:#1f6b4a;color:#fff;text-decoration:none;font-size:26px;font-weight:800;border-radius:16px;padding:24px">📞 Call · Llamar</a><p style="color:#666">Tap the green button to call.<br>Toca el botón verde para llamar.</p></div>
<div id="cam" hidden><div class="top"><div class="sr" id="sr"></div><div class="t" id="ti"></div><div class="s" id="si"></div><div class="hl">Take 2 photos of the finished job: one <b>close-up</b> and one <b>from far</b> (whole area).<br><i>Toma 2 fotos: una <b>de cerca</b> y una <b>de lejos</b> (toda el área).</i></div></div>
<div class="mid"><div class="steps"><div class="stp" id="s1"><div class="bx" id="b1"><span>1</span></div><b>Close-up</b><i>De cerca</i></div><div class="stp" id="s2"><div class="bx" id="b2"><span>2</span></div><b>From far</b><i>De lejos</i></div></div><div id="gl" class="gl" hidden></div><div class="g" id="g"></div><label class="shot" id="sh"><b>📷</b><span id="sl">Take photo</span><small id="sl2">Tomar foto</small><input type="file" accept="image/*" capture="environment" onchange="add(this)"></label>
<div class="row"><label class="b2">🎥 Record video<small>Grabar video</small><input type="file" accept="video/*" capture="environment" onchange="add(this)"></label><label class="b2">🖼️ From phone<small>De la galería</small><input type="file" accept="image/*,video/*" multiple onchange="add(this)"></label></div></div>
<div class="foot"><div id="bar"></div><button class="up" id="up" hidden onclick="upload()"></button><button class="done" id="dn" hidden onclick="goBack()">✓ Done — go back to the job<small>Listo — volver al trabajo</small></button></div></div>
<script>
var h=decodeURIComponent(location.hash.slice(1)),L=[];
if(h.indexOf('cam|')==0){var p=h.split('|');document.getElementById('cam').hidden=false;document.getElementById('sr').textContent=p[1]||'';document.getElementById('ti').textContent=p[2]||'';document.getElementById('si').textContent=(p[3]||'')+' · '+(p[4]||'')}
else{document.getElementById('call').hidden=false;var d=h.replace(/\D/g,'');if(d.length==10)d='1'+d;var x=d.slice(-10);document.getElementById('n').textContent='('+x.slice(0,3)+') '+x.slice(3,6)+'-'+x.slice(6);document.getElementById('b').href='tel:+'+d}
function $(i){return document.getElementById(i)}
function slot(t){return L.filter(function(x){return x.tag==t})[0]}
function nextTag(){return !slot('close')?'close':!slot('far')?'far':'extra'}
function add(i){[].slice.call(i.files,0,6).forEach(function(f){var it={f:f,v:/^video/.test(f.type),u:URL.createObjectURL(f),st:'new',tag:nextTag()};L.push(it);
 var w=document.createElement('div');it.w=w;w.innerHTML=(it.v?'<video muted src="'+it.u+'"></video><span class="pv">▶</span>':'<img src="'+it.u+'">')+'<button class="x">×</button>';
 w.querySelector('.x').onclick=function(){L.splice(L.indexOf(it),1);w.remove();ui()};w.querySelector('img,video').onclick=function(){zoom(it)};
 if(it.tag=='extra')$('g').appendChild(w)});i.value='';$('dn').hidden=true;ui()}
function zoom(it){var z=$('zz');z.innerHTML=it.v?'<video controls autoplay src="'+it.u+'"></video>':'<img src="'+it.u+'">';z.hidden=false}
function box(n,t){var it=slot(t),b=$('b'+n),s=$('s'+n);s.className='stp'+(it?' have':(nextTag()==t?' now':''));
 if(it){b.innerHTML='';b.appendChild(it.w)}else b.innerHTML='<span>'+n+'</span>'}
function ui(){box(1,'close');box(2,'far');var nt=nextTag(),nw=L.filter(function(x){return x.st=='new'}).length,sent=L.filter(function(x){return x.st=='ok'}).length,both=slot('close')&&slot('far');
 $('sl').textContent=nt=='close'?'Close-up photo':nt=='far'?'Photo from far':'Extra photo';$('sl2').textContent=nt=='close'?'Foto de cerca':nt=='far'?'Foto de lejos':'Foto extra';
 $('gl').hidden=!(both&&nw);$('gl').innerHTML='Check your photos — tap × to retake one<br><i>Revisa tus fotos — toca × para repetir una</i>';
 var u=$('up');u.hidden=!(both&&nw);u.innerHTML='📤 Upload '+nw+(nw==1?' photo':' photos')+' to HelpDesk<small>Subir '+nw+(nw==1?' foto':' fotos')+' a HelpDesk</small>';
 var b=$('bar');if(!both&&L.length){b.style.background='#333';b.innerHTML=(slot('close')?'Now take one <b>from far</b>':'Now take one <b>close-up</b>')+'<small>'+(slot('close')?'Ahora toma una de lejos':'Ahora toma una de cerca')+'</small>'}
 else if(!nw&&sent){b.style.background='#2e8b5f';b.innerHTML='✓ '+sent+' photos sent to HelpDesk · '+$('sr').textContent+' · TEST<small>'+sent+' fotos enviadas a HelpDesk</small>';$('dn').hidden=false}else{b.innerHTML='';b.style.background=''}}
function upload(){var q=L.filter(function(x){return x.st=='new'}),k=0;$('up').hidden=true;$('gl').hidden=true;q.forEach(function(it){it.st='up';var x=it.w.querySelector('.x');if(x)x.remove();it.w.insertAdjacentHTML('beforeend','<div class="sp">Uploading…</div>')});
 (function nx(){if(k>=q.length){ui();return}var it=q[k];$('bar').style.background='#8a5a12';$('bar').innerHTML='⏳ Uploading '+(k+1)+' of '+q.length+'…<small>Subiendo '+(k+1)+' de '+q.length+'…</small>';save(it,function(){it.st='ok';it.w.querySelector('.sp').outerHTML='<div class="ok">✓</div>';k++;nx()})})()}
function goBack(){if(history.length>1)history.back();else{window.close();setTimeout(function(){$("bar").innerHTML="Tap the X at the top to go back<small>Toca la X arriba para volver</small>"},400)}}
function save(it,cb){setTimeout(cb,900)}
ui();
</script><div id="zz" hidden onclick="this.hidden=true;this.innerHTML=''"></div></body></html>
